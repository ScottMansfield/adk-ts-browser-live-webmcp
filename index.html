<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADK Live + Chrome WebMCP Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              cyan: {
                950: '#082f49',
              },
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden">
    <!-- Top Navigation Bar -->
    <header class="h-14 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md px-5 flex items-center justify-between shrink-0 z-20">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center font-black text-white text-base shadow-lg shadow-cyan-500/20">
          ⚡
        </div>
        <div>
          <h1 class="text-sm font-bold text-slate-100 tracking-tight flex items-center gap-2">
            ADK Live + Chrome WebMCP
            <span class="text-[10px] font-mono font-medium px-2 py-0.5 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
              In-Browser Agent
            </span>
          </h1>
          <p class="text-[11px] text-slate-400">Real-time Gemini Live audio streaming controlling webpage via native WebMCP tools</p>
        </div>
      </div>

      <div class="flex items-center space-x-4">
        <div id="top-webmcp-status" class="flex items-center space-x-1.5 text-xs font-mono">
          <!-- Populated by JS -->
        </div>
        <a href="https://github.com/ScottMansfield/adk-ts-browser-live-webmcp" target="_blank" class="text-xs text-slate-400 hover:text-slate-200 transition-colors flex items-center gap-1.5 font-medium">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
          GitHub
        </a>
      </div>
    </header>

    <!-- Main Split Screen -->
    <main class="flex-1 grid grid-cols-12 gap-0 overflow-hidden">
      <!-- Left Panel: Target Web Application (WebMCP Tool Provider) -->
      <section id="travel-app-container" class="col-span-7 border-r border-slate-800 p-5 overflow-y-auto bg-slate-900/30">
        <!-- Rendered by TravelApp -->
      </section>

      <!-- Right Panel: In-Browser ADK Live Agent -->
      <section id="adk-agent-panel" class="col-span-5 flex flex-col h-full bg-slate-950/70 overflow-hidden">
        <!-- Rendered by AgentUI -->
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
